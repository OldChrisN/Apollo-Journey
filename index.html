<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo's Journey to Orbit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/apollofavicon.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=keyboard_double_arrow_left,keyboard_double_arrow_right,visibility,visibility_off,pause,play_arrow,close,music_note,music_off " />
    <script src="https://kit.fontawesome.com/269ee36180.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body> 
    <div class="title_sceen">
        <h5>Chris Presents</h5>
        <h3>Apollo's Journey to Orbit</h3>
        <img src="images/ApolloJourney.webp">
    </div>

    <div class="button_background">
        <a href="https://github.com/OldChrisN/Apollo-Journey" target="_blank" class="gitbutton"><i class="fa-brands fa-github fa-3x" style="color: rgb(241, 244, 246);"></i></a>
        <button id="launch_now" class="launch_button">LAUNCH!</button>
        <p class="headsup">Music plays at T+ 3:00:00</p>
        <p class="headsuptwo">Best on a computer or a recent phone.</p>
        <p class="copyright">&copy; 2026 Christopher Ngankam</p>
    </div>

    <div id="music_by" class="music_by">♪ Heaven and Hell — Jeremy Blake</div>
    <div id="launch_event" class="launch_event"></div>

    <div class="top_container">
        <div class="flight_dropdown">
            <button id="toggle_flight">Flight Graphs</button>
            <div class="content" id="flight_content">
                <button id="Alt_T_Drop">Altitude vs. Time</button>
                <button id="Vel_T_Drop">Velocity vs. Time</button>
                <button id="Mass_T_Drop">Mass vs. Time</button>
                <button id="Acc_T_Drop">Acceleration vs. Time</button>
                <button id="Pres_T_Drop">Dynamic Pressure vs Time</button>
            </div>
        </div>

        <div class="highest_lowest">
            <p id="apoapsis_info"></p>
            <p id="periapsis_info"></p>
        </div>

        <div class="playback_container">
            <button class="music_button" id="music_button_id"><span class="material-symbols-outlined">music_note</span></button>

            <button id="pause_button" class="pause_button_class"><span class="material-symbols-outlined">pause</span></button>
            <button id="decrease_speed"><span class="material-symbols-outlined">keyboard_double_arrow_left</span></button>
            <p id="playback_display" class="playback_number">1x</p>
            <button id="increase_speed"><span class="material-symbols-outlined">keyboard_double_arrow_right</span></button>

            <button id="toggle_telemetry" class="hide_button"><span class="material-symbols-outlined">visibility</span></button>
            <button id="X_button" class="hidden"><span class="material-symbols-outlined">close</span></button>
        </div>
    </div>

    <div class="info_container" id="telemetry_container">
        <ul id="rocket_info" class="rocket_info_group">
            <li id="altitude_info"></li>
            <li id="velocity_info"></li>
            <li id="vertical_velocity_info"> </li>
            <li id="acceleration_info"></li>
            <li id="mass_info"></li>
            <li id="mach_info"></li>
            <li id="pitch_info"></li>
            <li id="pressure_info"></li>
            <li id="max_Q_info"></li>
            <li id="gforce_info"></li>
        </ul>

        <div class="time_div">
            <p id="mission_time_label">Mission Time</p>
            <p id="time_info" class="time_container">00:00:00</p>
        </div>
        

        <ul id="stage_info" class="stage_info_group">
            <li id="current_stage_info"></li>
            <li id="thrust_info"></li>
            <li id="delta_v_info"></li>
            <li id="twr_info"></li>
            <li id="propellant_info"></li>
            <li id="percentage_info"></li>
            <li id="orbit_question"></li>
        </ul>
    </div>

    <div class="alt_time_chart">
    <canvas id="myChart"></canvas>
    </div>

    <div class="vel_time_chart">
    <canvas id="velChart"></canvas>
    </div>

    <div class="mass_time_chart">
    <canvas id="massChart"></canvas>
    </div>

    <div class="acceleration_time_chart">
    <canvas id="accelerationChart"></canvas>
    </div>

    <div class="pressure_time_chart">
    <canvas id="pressureChart"></canvas>
    </div>

    <canvas id="sim_canvas"></canvas>

    <div id="fade_overlay"></div>
    <div id="thanks_msg">Thanks for visiting</div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="importmap">
    {
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
    }
    </script>

    <script src="launch.JS"></script>
    
    <script type="module" src="main.JS"></script>
</body>
</html>
